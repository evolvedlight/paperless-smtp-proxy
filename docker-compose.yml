services:
  paperless-smtp-proxy:
    # Option A: Pull the pre-built image from GitHub Container Registry (Recommended)
    image: ghcr.io/evolvedlight/paperless-smtp-proxy:latest
    
    # Option B: Build locally if deploying directly from source code
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: paperless-smtp-proxy
    restart: unless-stopped
    ports:
      # SMTP Port for receiving incoming emails
      - "25:25"
      # Web Port for SignalR Live Dashboard
      - "8080:8080"
    environment:
      # SMTP Server Configuration
      - SmtpServer__Port=25
      - SmtpServer__ServerName=paperless.brown.bg
      - SmtpServer__AllowAnyRecipient=true
      # Paperless-ngx Integration Configuration
      # Set Enabled to true when you are ready to send attachments to Paperless
      - Paperless__Enabled=false
      - Paperless__BaseUrl=http://paperless-web:8000
      - Paperless__ApiToken=YOUR_PAPERLESS_API_TOKEN_HERE
      - Paperless__AutoUploadAttachments=true
      - Paperless__TitleFormat={Subject} - {FileName}
      - Paperless__DefaultTags__0=email-import
    # If Paperless is on an existing Docker network in Portainer, uncomment to connect:
    # networks:
    #   - paperless_network

# networks:
#   paperless_network:
#     external: true
